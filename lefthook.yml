pre-commit:
  parallel: true
  commands:
    ruff-check:
      glob: "*.py"
      run: uv run ruff check {staged_files}
    ruff-format:
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
    pyright:
      glob: "*.py"
      run: uv run --group docs pyright
    complexity:
      glob: "*.py"
      run: uv run lizard -l python -C 12 -L 100 -a 14 -w learnpdes docs/website tests
