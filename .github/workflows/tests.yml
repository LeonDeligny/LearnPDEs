name: Run Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install animation encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run test scenarios
        run: |
          uv run coverage run --source=learnpdes -m unittest discover -s tests -p "test*.py"
          uv run coverage xml
