[project]
name = "learnpdes"
version = "1.0"
description = "Physics-informed neural networks for solving partial differential equations."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Leon Deligny" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.12"
dependencies = [
    "ambiance",
    "complexpytorch",
    "dash",
    "fsspec",
    "flask",
    "gmsh",
    "imageio",
    "matplotlib",
    "narwhals",
    "networkx",
    "numpy",
    "pillow",
    "plotly",
    "pydantic",
    "requests",
    "scikit-learn",
    "sympy",
    "torch",
    "torch-geometric",
    "torchaudio",
    "torchvision",
    "typing-extensions",
]

[dependency-groups]
dev = [
    "coverage",
    "ruff",
]

[project.urls]
Repository = "https://github.com/LeonDeligny/LearnPDEs"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["learnpdes*"]
exclude = ["tests", "tests.*"]
