[project]
name = "learnpdes"
version = "1.0"
requires-python = ">=3.12"
dependencies = [
    "ambiance",
    "complexpytorch",
    "dash",
    "fsspec",
    "flask",
    "gmsh",
    "imageio",
    "matplotlib",
    "narwhals",
    "networkx",
    "numpy",
    "pillow",
    "plotly",
    "pydantic",
    "requests",
    "scikit-learn",
    "sympy",
    "torch",
    "torch-geometric",
    "torchaudio",
    "torchvision",
    "typing-extensions",
]

[dependency-groups]
dev = [
    "coverage",
    "flake8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
