[project]
name = "learnpdes"
version = "1.0"
description = "Physics-informed neural networks for solving partial differential equations."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Leon Deligny" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.12"
dependencies = [
    "ambiance",
    "complexpytorch",
    "dash",
    "fsspec",
    "flask",
    "gmsh",
    "imageio",
    "kaleido>=1,<2",
    "narwhals",
    "networkx",
    "numpy",
    "pillow",
    "plotly>=6.1.1",
    "pydantic",
    "requests",
    "scikit-learn",
    "sympy",
    "torch",
    "torch-geometric",
    "torchaudio",
    "torchvision",
    "typing-extensions",
    "typer>=0.16,<1",
    "rich>=13,<15",
]

[project.scripts]
learnpdes = "learnpdes.cli:main"

[dependency-groups]
dev = [
    "coverage",
    "ruff",
]
export = [
    "kaleido>=1,<2",
]

[project.urls]
Repository = "https://github.com/LeonDeligny/LearnPDEs"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["learnpdes*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
"learnpdes" = ["data/*.su2"]
"learnpdes.utils" = ["cosinus_comparison.html", "training_playback.js"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E265"]

[tool.ruff.format]
quote-style = "single"
